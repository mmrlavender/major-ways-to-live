<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --cream:#FCFFEA; --green:#AAECA7; --green-2:#D6F5C8;
    --ink:#12263A; --ink-2:#40566E; --blue:#3D8DCD; --blue-deep:#1A73BB;
    --pink:#F8D3BF; --line:#E3E9DA; --sand:#E9D3AC; --sea:#BFE9F5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#EAF7FF 0%,#FCFFEA 62%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.65; min-height:100vh;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:18px 16px 40px}

  /* 页眉 */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .num{
    display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:38px;padding:0 10px;
    border-radius:10px;background:var(--green);color:#0F3D1B;font-weight:800;font-size:20px;letter-spacing:.5px;
  }
  .top .label{font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:2px}
  h1{margin:10px 0 4px;font-size:30px;line-height:1.25;font-weight:900;color:#0E3517;letter-spacing:-.5px}
  h1 .q{color:#fff;background:#0E3517;border-radius:8px;padding:0 7px;margin:0 2px;font-style:normal}
  .sub{margin:0 0 12px;font-size:14px;color:#23512C;max-width:40em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .chip{background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#23512C;box-shadow:0 2px 0 rgba(16,54,23,.10)}
  .hint{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fff;border:1px dashed #C9E3BE;border-radius:12px;padding:8px 14px;font-size:13px;color:#2E7D46;font-weight:700;
  }
  .hint .dot{width:8px;height:8px;border-radius:50%;background:#2E7D46;animation:blink 1.6s infinite}
  .hint .prog{margin-left:auto;font-weight:800;color:var(--blue-deep)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* 岛屿舞台 */
  .stage{position:relative;margin-top:6px;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(18,38,58,.12);background:#EAF7FF}
  .stage svg{display:block;width:100%;height:auto}

  .node{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .18s ease}
  .node:hover,.node:focus{transform:translateY(-4px) scale(1.03);outline:none}
  .node .halo{opacity:0;transition:opacity .2s ease}
  .node:hover .halo,.node:focus .halo{opacity:.35}
  .node .hit{fill:transparent}
  .node.active .halo{opacity:.5}
  .node .flag{opacity:0;transition:opacity .2s}
  .node.done .flag{opacity:1}
  .node .ping{animation:ping 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{0%{transform:scale(.86);opacity:.5}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
  .tag-text{font-size:13px;font-weight:800;fill:#0E3517;font-family:inherit}
  .cloud{animation:drift 26s ease-in-out infinite alternate}
  .cloud.c2{animation-duration:34s;animation-delay:-6s}
  @keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  .boat{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* 面板 */
  .panel{
    position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--cream);
    box-shadow:-14px 0 40px rgba(18,38,58,.16);transform:translateX(102%);
    transition:transform .28s cubic-bezier(.22,.8,.3,1);z-index:30;display:flex;flex-direction:column;
  }
  .panel.open{transform:translateX(0)}
  .p-head{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line);background:#fff}
  .p-head .p-kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:#2E7D46;margin:0}
  .p-head h2{margin:2px 0 0;font-size:20px;font-weight:900;color:#0E3517;line-height:1.3}
  .p-close{
    margin-left:auto;flex:none;appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1;cursor:pointer
  }
  .p-close:hover{background:#F4FBEF}
  .p-body{padding:16px 18px 28px;overflow-y:auto;flex:1}
  .p-body p{margin:0 0 10px;font-size:14px}
  .lead{font-size:14.5px;color:#1F4A2A;font-weight:700;background:#F4FBEF;border-left:3px solid var(--green);padding:9px 12px;border-radius:8px}

  .item{background:#fff;border:1px solid var(--line);border-left:6px solid var(--bar,#1A73BB);border-radius:14px;padding:13px 14px;margin:0 0 12px;box-shadow:0 2px 10px rgba(18,38,58,.05)}
  .item h3{margin:0 0 2px;font-size:16.5px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fit{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--bar,#1A73BB);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.5px}
  .item .one{margin:0 0 8px;font-size:13.5px;color:var(--ink-2)}
  .item dl{margin:0;display:grid;gap:8px}
  .item dt{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--bar,#1A73BB);margin-bottom:1px}
  .item dd{margin:0;font-size:13.5px;color:var(--ink)}
  .item ul{margin:0;padding-left:17px;font-size:13.5px}
  .item .why dd,.item .bridge dd{color:#1F4A2A;font-weight:700}
  .item .step{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--cream);border:1px dashed #C9E3BE;font-size:13px;color:#1F4A2A}
  .item .step b{display:block;font-size:11.5px;letter-spacing:1px;color:#2E7D46;margin-bottom:2px}

  .steps li{margin:0 0 10px;font-size:14px}
  .steps li b{color:#0E3517}
  .foot{margin:16px 0 0;text-align:center;font-size:12.5px;color:#7C8A76}

  .scrim{position:fixed;inset:0;background:rgba(18,38,58,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}

  @media (max-width:720px){
    h1{font-size:24px}
    .panel{top:auto;bottom:0;height:auto;max-height:78vh;width:100%;transform:translateY(102%);border-radius:20px 20px 0 0}
    .panel.open{transform:translateY(0)}
  }
  @media print{
    .panel{position:static;transform:none;box-shadow:none;width:auto;height:auto}
    .scrim,.hint{display:none}
  }
</style>
</head>

<script>
(function(){
  var COLORS = {core:"#1A73BB", public:"#2E9E5B", hybrid:"#C98A12", media:"#B14AA0", ops:"#3D8DCD", switch:"#7A6BD6"};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function list(a){return (a||[]).map(function(x){return "<li>"+esc(x)+"</li>";}).join("");}

  /* --- 页头 --- */
  var h1 = document.getElementById("h1");
  if (DATA.headline) { h1.textContent = DATA.headline; document.title = DATA.headline; }
  else {
    document.getElementById("major").textContent = DATA.major || "";
    document.title = "我的职业探索岛 · " + (DATA.major || "专业");
  }
  if (DATA.islandName) {
    document.title = DATA.islandName;
    var islandLabel = document.getElementById("islandLabel");
    if (islandLabel) islandLabel.textContent = DATA.islandName;
  }
  document.getElementById("sub").textContent = DATA.sub || document.getElementById("sub").textContent;
  document.getElementById("chips").innerHTML = (DATA.profileChips||[]).map(function(c){
    return '<span class="chip">'+esc(c)+'</span>';
  }).join("");
  var meta = [];
  if (DATA.major) meta.push(DATA.major + (DATA.college ? " · " + DATA.college : ""));
  if (DATA.note) meta.push(DATA.note);
  if (DATA.updated) meta.push("整理于 " + DATA.updated);
  document.getElementById("foot-meta").textContent = meta.join(" · ");

  /* --- 节点与面板 --- */
  var nodes = DATA.nodes || [];
  var panel = document.getElementById("panel");
  var body = document.getElementById("p-body");
  var scrim = document.getElementById("scrim");
  var kicked = document.getElementById("p-kicker");
  var ptitle = document.getElementById("p-title");
  var lit = {};

  function pathCard(p){
    var bar = COLORS[p.family] || "#1A73BB";
    return '<article class="item" style="--bar:'+bar+'">'
      + '<h3>'+esc(p.name)+(p.fit?'<span class="fit">'+esc(p.fit)+'</span>':'')+'</h3>'
      + '<p class="one">'+esc(p.oneline)+'</p><dl>'
      + (p.why?'<div class="why"><dt>为什么适合你</dt><dd>'+esc(p.why)+'</dd></div>':'')
      + (p.bridge?'<div class="bridge"><dt>跟你的专业怎么搭</dt><dd>'+esc(p.bridge)+'</dd></div>':'')
      + '<div><dt>典型岗位</dt><dd>'+esc((p.roles||[]).join(" · "))+'</dd></div>'
      + '<div><dt>关键能力</dt><dd><ul>'+list(p.skills)+'</ul></dd></div>'
      + '<div><dt>怎么进去</dt><dd>'+esc(p.access)+'</dd></div>'
      + '<div><dt>适合谁</dt><dd>'+esc(p.match)+'</dd></div>'
      + '<div><dt>代价与风险</dt><dd>'+esc(p.cost)+'</dd></div>'
      + '</dl>'+(p.next?'<p class="step"><b>这周就能做的一步</b>'+esc(p.next)+'</p>':'')
      + '</article>';
  }

  function render(n){
    if (n.kind === "profile") {
      var chips = (DATA.profileChips||[]).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join("");
      var says = (n.says||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join("");
      return (n.lead?'<p class="lead">'+esc(n.lead)+'</p>':'')
        + '<div class="chips" style="margin:12px 0 14px">'+chips+'</div>'
        + (says?'<p style="margin:0 0 6px;font-size:13px;font-weight:800;color:#2E7D46;letter-spacing:1px">你在这轮探索里说过的</p><ul style="margin:0 0 12px;padding-left:18px;font-size:14px">'+says+'</ul>':'')
        + '<p style="font-size:13px;color:var(--ink-2)">'+(n.tail?esc(n.tail):'画像是搬运工，不是判决书。下面的排序只按你说的来，随时可以改。')+'</p>';
    }
    if (n.kind === "paths") {
      return (n.lead?'<p class="lead">'+esc(n.lead)+'</p>':'')
        + (n.items||[]).map(pathCard).join("");
    }
    if (n.kind === "jobs") {
      return (n.lead?'<p class="lead">'+esc(n.lead)+'</p>':'')
        + (n.items||[]).map(function(j){
            return '<article class="item" style="--bar:#B14AA0">'
              + '<h3>'+esc(j.name)+(j.category?'<span class="fit" style="background:#B14AA0">'+esc(j.category)+'</span>':'')+'</h3>'
              + '<p class="one">'+esc(j.oneline)+'</p><dl>'
              + (j.bridge?'<div class="bridge"><dt>跟你的专业怎么搭</dt><dd>'+esc(j.bridge)+'</dd></div>':'')
              + '<div><dt>典型岗位</dt><dd>'+esc((j.roles||[]).join(" · "))+'</dd></div>'
              + '<div><dt>关键能力</dt><dd><ul>'+list(j.skills)+'</ul></dd></div>'
              + '<div><dt>怎么进去</dt><dd>'+esc(j.access)+'</dd></div>'
              + '<div><dt>代价与风险</dt><dd>'+esc(j.cost)+'</dd></div>'
              + '</dl>'+(j.next?'<p class="step"><b>这周就能做的一步</b>'+esc(j.next)+'</p>':'')
              + '</article>';
          }).join("");
    }
    if (n.kind === "steps") {
      return (n.lead?'<p class="lead">'+esc(n.lead)+'</p>':'')
        + '<ol class="steps" style="margin:12px 0 0;padding-left:20px">'
        + (n.items||[]).map(function(s){ return '<li><b>'+esc(s.from)+'</b>：'+esc(s.text)+'</li>'; }).join("")
        + '</ol>';
    }
    return '<p class="lead">'+esc(n.lead||"这块还没填内容。")+'</p>';
  }

  function open(id){
    var n = null;
    for (var i=0;i<nodes.length;i++) if (nodes[i].id === id) n = nodes[i];
    if (!n) return;
    kicked.textContent = n.kicker || "岛屿";
    ptitle.textContent = n.label || "";
    body.innerHTML = render(n);
    panel.classList.add("open");
    panel.setAttribute("aria-hidden","false");
    scrim.classList.add("on");
    var g = document.getElementById("n-" + id);
    if (g) g.classList.add("active");
    lit[id] = 1;
    var f = document.getElementById("f-" + id);
    if (f) f.classList.add("done");
    if (g) g.classList.add("done");
    var total = nodes.length || 5;
    var cnt = 0;
    for (var k in lit) if (lit[k]) cnt++;
    document.getElementById("prog").textContent = "已点亮 " + cnt + " / " + total;
    body.scrollTop = 0;
  }
  function close(){
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden","true");
    scrim.classList.remove("on");
    Array.prototype.forEach.call(document.querySelectorAll(".node"), function(g){ g.classList.remove("active"); });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".node"), function(g){
    g.addEventListener("click", function(){ open(g.getAttribute("data-id")); });
    g.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(g.getAttribute("data-id")); }
    });
  });
  document.getElementById("p-close").addEventListener("click", close);
  scrim.addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });
})();
</script>
</body>
</html>
