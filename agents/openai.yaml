interface:
  display_name: 专业的N种活法
  short_description: 输入一个专业名，生成该专业的多条职业路径，并渲染成可漫游的三维职业探索岛
  default_prompt: |
    请使用 major-ways-to-live 技能，带我做一次职业路径探索：
    先问我专业和现在所处阶段，再按访谈节奏补齐我想要的活法、兴趣、优势和硬条件（城市、升学意愿、需要避开的项），
    然后把「我的 N 种活法」按匹配度排好序讲给我听，最后生成一座三维职业探索岛页面。
    请只使用我真实说过的情况和技能库里的真实数据，不要编造经历、薪资、编制或岗位缺口。
